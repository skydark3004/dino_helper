# Mỗi lần push lên master: build DinoReplayReader.exe, nén thành DinoHelper.zip và tạo Release mới (đánh dấu Latest).
# Link tải không đổi (luôn là bản mới nhất):
#   https://github.com/skydark3004/dino_helper/releases/latest/download/DinoHelper.zip
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (csc .NET Framework 4, C# 5 – giống trên máy)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg\DinoHelper | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize /nowarn:649 /target:winexe `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Management.dll `
            /out:pkg\DinoHelper\DinoReplayReader.exe src\*.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Đóng gói
        shell: pwsh
        run: |
          $d = "pkg\DinoHelper"
          Copy-Item map_template.html, DocNhanh.bat, DocDayDu.bat, IsleReplayConfig.bat, HUONG_DAN.txt $d
          if (Test-Path gastro_learned.txt) { Copy-Item gastro_learned.txt $d }
          Copy-Item maps $d -Recurse
          Compress-Archive -Path $d -DestinationPath DinoHelper.zip -CompressionLevel Optimal

      - name: Tạo Release (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dino Helper (bản ${{ github.run_number }})
          body: |
            ${{ github.event.head_commit.message }}

            Tải: https://github.com/${{ github.repository }}/releases/latest/download/DinoHelper.zip
            Giải nén cả thư mục rồi chạy DinoReplayReader.exe (xem HUONG_DAN.txt).
          files: DinoHelper.zip
          make_latest: true
