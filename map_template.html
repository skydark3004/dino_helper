<!doctype html>
<html lang="vi" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ replay Dino</title>
<style>
  :root {
    --bg: #12140f; --panel: #1c1f18; --line: #2e3327; --text: #e4e6dc; --muted: #9aa08c;
    --accent: #e0b84a; --you: #ffd34d; --player: #ff5a4f; --dino: #ff9f43; --corpse: #a39e93;
    --fish: #4fb3ff; --animal: #8fe36b; --plant: #5fbf4a; --fruit: #f0a030; --meat: #c0392b; --burrow: #a47148; --ptero: #b483ff; --nest: #f5e6a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px; overflow-y: auto; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
  label.layer { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  button { background: #2a2f22; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; }
  main { position: relative; overflow: hidden; background: var(--bg); }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #cv { position: relative; }
  #bg { position: absolute; pointer-events: none; will-change: transform; }
  canvas.drag { cursor: grabbing; }
  canvas.pick { cursor: crosshair; }
  #tip { position: absolute; pointer-events: none; background: rgba(20,22,17,.95); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; display: none; white-space: nowrap; font-size: 12px; }
  #tip b { color: var(--accent); }
  #tip .tt { display: grid; grid-template-columns: auto auto; gap: 1px 10px; margin-top: 4px; }
  #tip .tl { color: var(--muted); }
  #tip .tn { color: var(--muted); font-size: 11px; margin-top: 3px; }
  #hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #1a1a1a; padding: 6px 12px; border-radius: 6px; font-weight: 600; display: none; }
  #compass { position: absolute; top: 12px; right: 14px; text-align: center; color: var(--muted); font-weight: 700; }
  #compass .n { color: var(--player); font-size: 16px; }
  .info { color: var(--muted); font-size: 12px; }
  .near div { padding: 2px 0; }
  .near b { font-variant-numeric: tabular-nums; }
  .near-item { cursor: pointer; border-radius: 4px; padding: 2px 4px !important; margin: 0 -4px; }
  .near-item:hover { background: #2a2f22; }
  #target { line-height: 1.5; }
  .tg-name { font-weight: 600; }
  .tg-big { font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .arrows { display: flex; gap: 14px; margin: 6px 0; }
  .arrow-box { text-align: center; }
  .arrow-cap { font-size: 11px; color: var(--muted); max-width: 90px; }
  #toasts { position: absolute; top: 12px; left: 14px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 5; }
  .toast { background: rgba(28,30,24,.96); border-left: 5px solid var(--player); border-radius: 6px; padding: 7px 12px; min-width: 260px; max-width: 420px; box-shadow: 0 4px 14px rgba(0,0,0,.5); pointer-events: auto; cursor: pointer; transition: opacity .4s; }
  .toast b { color: var(--you); }
  .toast div { color: var(--text); font-size: 12px; }
  /* chế độ overlay (map.html?overlay): radar nhỏ quanh bạn, không có thanh bên */
  .overlay #app { display: block; }
  .overlay main { height: 100%; }
  .overlay aside, .overlay #toasts, .overlay #tip, .overlay #hint { display: none !important; }
  .overlay #compass { top: 4px; right: 8px; font-size: 11px; }
  .overlay #compass .n { font-size: 13px; }
  .overlay canvas { cursor: default; }
  @media (max-width: 700px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { max-height: 45vh; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Bản đồ replay</h1>
    <div class="sub" id="meta"></div>

    <h2>Thời gian</h2>
    <input type="range" id="slider" min="0" max="100" step="0.1" value="0">
    <div class="row">
      <button id="play">▶ Phát</button>
      <button id="speed">x5</button>
      <span id="time" style="margin-left:auto;align-self:center"></span>
    </div>

    <h2>Lớp hiển thị</h2>
    <div id="layers"></div>

    <h2>Chỉ đường</h2>
    <div id="target"></div>

    <h2>Gần bạn nhất</h2>
    <div class="near" id="near"><span class="info">—</span></div>

    <h2>Điều khiển</h2>
    <div class="row">
      <button id="findMe" class="primary">Về khủng long của tôi</button>
      <button id="fitAll">Xem toàn bộ</button>
    </div>
    <div class="info">Lăn chuột để phóng to, kéo để di chuyển.</div>

    <h2>Ảnh bản đồ nền</h2>
    <div class="row">
      <button id="pickImg">Chọn ảnh…</button>
      <button id="calib">Căn chỉnh</button>
      <button id="clearImg">Bỏ ảnh</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="info" id="imgInfo">Chưa có ảnh. Đặt file <b>map.png</b> hoặc <b>map.jpg</b> vào thư mục của tool để tự động dùng.</div>
  </aside>
  <main>
    <canvas id="bg"></canvas>
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="hint"></div>
    <div id="compass"><div class="n">B</div>▲</div>
    <div id="toasts"></div>
  </main>
</div>
<script src="data.js" charset="utf-8"></script>

  player: { name: "Người chơi khác",    color: "--player", r: 6, on: true },

function updateMeta() {
  const el = document.getElementById("meta");
  if (!DATA) { el.textContent = "Không có dữ liệu"; return; }
  el.innerHTML = esc(`${DATA.map} · ${DATA.start} · ${Math.round(DATA.length)} giây · ${actors.length} đối tượng`)

  for (const k in CATS) if (CATS[k].cntEl) CATS[k].cntEl.textContent = actors.filter(a => a.c === k).length;

// ---------- lớp hiển thị ----------
const layersEl = document.getElementById("layers");
const LAYER_INPUT = {}; // khoá lớp -> ô tick trên trang (để tool bật/tắt từ xa)
let pendingLayers = null; // cài đặt lớp tool gửi gần nhất
let sseDown = false;      // mở qua http nhưng mất kết nối với tool
// Tool gửi {khoá: true/false} (sự kiện "layers" qua SSE) -> áp dụng + cập nhật ô tick
function applyLayers(L) {
  const set = {
    player: v => CATS.player.on = v, animal: v => CATS.animal.on = v, corpse: v => CATS.corpse.on = v, fish: v => CATS.fish.on = v, meat: v => CATS.meat.on = v,
    ghost: v => SHOW.ghost = v, map: v => gw.on = v, poi: v => gw.poiOn = v, mud: v => gw.mudOn = v,
    gastro: v => gw.gastroOn = v, pvngastro: v => gw.pvnGastroOn = v, heat: v => gw.heatOn = v,
  };
  for (const k in L) if (set[k]) { set[k](!!L[k]); if (LAYER_INPUT[k]) LAYER_INPUT[k].checked = !!L[k]; }
  draw();
}
for (const k in CATS) {
  const l = document.createElement("label");
  l.className = "layer";
  l.innerHTML = `<input type="checkbox" ${CATS[k].on ? "checked" : ""}><span class="sw" style="background:${CATS[k].hex}"></span>${CATS[k].name}<span class="cnt"></span>`;
  l.querySelector("input").onchange = e => { CATS[k].on = e.target.checked; draw(); };
  CATS[k].cntEl = l.querySelector(".cnt");
  LAYER_INPUT[k] = l.querySelector("input");
  layersEl.appendChild(l);
  if (k === "player") addToggle("Mất dấu (vị trí cuối)", "transparent", "", () => SHOW.ghost, v => SHOW.ghost = v, "ghost");
}

// ---------- cập nhật trực tiếp khi replay đang quay ----------
function applyData(d) {
  const first = !DATA;
  // trang /live chuyển sang replay khác (script cắt file) -> mã đối tượng khác nhau, bỏ mục tiêu đang ghim
  if (DATA && d.file !== DATA.file) { pinnedId = null; follow = true; live.tv = null; live.at = 0; }
  DATA = d; actors = d.actors; me = actors.find(a => a.c === "me");

// ---------- đồng hồ trực tiếp: chạy mượt theo thời gian thật giữa các lần nhận dữ liệu ----------
// Game ghi file từng đợt (0,15 s … 1 s). Thay vì nhảy tới thời điểm mới mỗi lần nhận, thời gian hiển thị chạy đều theo
// đồng hồ máy, trễ sau dữ liệu mới nhất một khoảng "lag" (tự học theo nhịp dữ liệu đến) để luôn có mẫu kế tiếp mà nội suy.
const live = { end: 0, at: 0, prev: 0, tv: null, iv: 0.3, dev: 0.1 };
function liveArrived(d) {
  const now = performance.now(), end = d.tmax !== undefined ? d.tmax : d.length;
  if (live.at && end > live.end) {
    const iv = Math.min(3, (now - live.at) / 1000);
    live.dev += (Math.abs(iv - live.iv) - live.dev) * 0.15;
    live.iv += (iv - live.iv) * 0.15;
  }
  if (end !== live.end || !live.at) { live.end = end; live.at = now; }
  // trễ hiển thị lớn = dữ liệu đến thưa (game ghi replay thưa / tool chậm)
  if (d.live && live.iv > 0.6 && now - (live.lagLogAt || -1e9) > 300000) { live.lagLogAt = now; perfLog("lag", `dữ liệu đến mỗi ~${live.iv.toFixed(2)} s → bản đồ trễ ~${liveLag().toFixed(1)} s`); } // gọi ~7 lần/s -> chỉ ghi 1 lần / 5 phút
}
// trần 3,5 s: máy chưa chỉnh game ghi dày (IsleReplayConfig.bat) nhận dữ liệu mỗi 1–2 s -> vẫn chạy liền mạch, chỉ trễ hơn
const liveLag = () => Math.min(3.5, Math.max(0.15, live.iv + 2 * live.dev));

function liveTime(now) {

  if (live.tv === null || Math.abs(target - live.tv) > 2) live.tv = target;
  else {
    const dt = Math.min(0.1, Math.max(0, (now - live.prev) / 1000));
    // sắp chạy hết dữ liệu mà chưa có dữ liệu mới -> chậm dần thay vì dừng khựng
    const room = live.end - live.tv, ease = Math.min(1, Math.max(0, room / Math.min(0.4, liveLag() * 0.5)));
    live.tv = Math.min(live.end, live.tv + Math.max(0, dt * ease + (target - live.tv) * Math.min(1, dt * 3)));
  }
  live.prev = now;
  return live.tv;
}

// ---------- ghi chỗ chậm của trang về tool (perf_log.txt cạnh exe) ----------
// khung hình treo, vẽ chậm, xử lý dữ liệu chậm, lâu không nhận dữ liệu, mất kết nối, trễ hiển thị lớn.
// GỘP để không spam: mỗi loại gửi ngay lần đầu; các lần sau trong 30 s chỉ đếm + nhớ lần nặng nhất, rồi gửi 1 dòng tóm tắt
// -> trang chậm liên tục cũng chỉ ~1 dòng / 30 s cho mỗi loại. Gom gửi mỗi 3 s (GET /log?m=...). Mở bằng file:// thì không gửi.

const perfQ = [], perfW = {};
let perfHiddenAt = 0; // trang bị ẩn (bị game che / thu nhỏ) -> trình duyệt dừng vẽ, không tính là treo
document.addEventListener("visibilitychange", () => { perfHiddenAt = performance.now(); });

}
if (PERF_ON) {

    const m = (OVERLAY ? "overlay" : "bản đồ") + ` ${innerWidth}×${innerHeight}@${devicePixelRatio}: ` + perfQ.splice(0).join(" | ");
    fetch("/log?m=" + encodeURIComponent(m.slice(0, 1500)), { cache: "no-store" }).catch(() => {});
  }, 3000);
  // GPU trình duyệt đang dùng (vẽ bằng CPU / "SwiftShader" -> dễ giật khi game chiếm GPU)
  let gpu = "?";
  try { const gl = document.createElement("canvas").getContext("webgl"), e = gl && gl.getExtension("WEBGL_debug_renderer_info"); gpu = e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl ? "webgl" : "không có WebGL"; } catch (e) {}
  perfLog("open", "mở trang · GPU: " + gpu);
}

// ---------- báo khủng long người chơi mới vào vùng (chỉ khi đang quay) ----------
// Báo khi một người chơi xuất hiện mà 30 giây trước đó chưa có mặt (không báo lại khi tool chuyển sang file mới).
const presentAt = new Map();

function checkNewPlayers(first) {

  if (!alertSeeded) { first = true; alertSeeded = true; }

  for (const a of actors) {

    const key = a.p || (a.n + "#" + a.i);

// nạp 1 file .js cạnh map.html (cách duy nhất đọc file mới khi mở trang bằng file://)

    try { const d = JSON.parse(e.data); gw.heat = d && d.ok && Array.isArray(d.cells) ? d.cells : null; } catch (err) { gw.heat = null; }

  });

} else {

// ---------- vị trí theo thời gian ----------
// Mẫu cuối cùng có thời gian <= time (tìm nhị phân); -1 nếu chưa có
function sampleIdx(T, time) {
  if (!T.length || T[0][0] > time) return -1;
  let lo = 0, hi = T.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (T[m][0] <= time) lo = m; else hi = m - 1; }
  return lo;
}
// Nội suy giữa 2 mẫu cho chuyển động mượt. Mẫu chỉ được lưu khi đã đi >= 0,3 m, nên khoảng trống dài = đang đứng yên:
// chỉ trượt trong INTERP_S giây cuối trước mẫu sau. Nhảy > 50 m (hồi sinh...) thì không trượt.
const INTERP_S = 0.5;
function lerpK(s0, s1, time) {
  if (!s1) return 0;
  const D = Math.min(s1[0] - s0[0], INTERP_S);
  if (D <= 0) return 0;
  const k = (time - (s1[0] - D)) / D;
  return k <= 0 ? 0 : k >= 1 ? 1 : k;
}
function posAt(a, time) {
  if (time < a.o - 0.01 || (a.e !== undefined && time > a.e)) return null;
  const T = a.t, i = sampleIdx(T, time);
  if (i < 0) return T[0];
  const s0 = T[i], s1 = T[i + 1], k = lerpK(s0, s1, time);
  if (k === 0 || Math.abs(s1[1] - s0[1]) + Math.abs(s1[2] - s0[2]) > 5000) return s0;
  return [time, Math.round(s0[1] + (s1[1] - s0[1]) * k), Math.round(s0[2] + (s1[2] - s0[2]) * k), Math.round(s0[3] + (s1[3] - s0[3]) * k)];
}
const dist = (p, q) => Math.hypot(p[1]-q[1], p[2]-q[2], p[3]-q[3]) / 100;
function bearing(p, q) { const e = q[1]-p[1], n = -(q[2]-p[2]); return Math.atan2(e, n) * 180 / Math.PI; }

// Hướng quay mặt tại thời điểm time, theo la bàn (0 = Bắc). Yaw của Unreal: 0 = Đông, 90 = Nam.
function headingAt(a, time) {
  const T = a.t, lo = sampleIdx(T, time);
  let i = lo;
  while (i >= 0 && T[i].length <= 4) i--;
  if (i < 0) return null;
  let h = T[i][4];
  const n = T[lo + 1];
  if (i === lo && n && n.length > 4) { const k = lerpK(T[lo], n, time); if (k > 0) h += (((n[4] - h) % 360 + 540) % 360 - 180) * k; } // xoay theo góc ngắn nhất
  return h + 90;
}
// Chỉ dẫn tương đối so với hướng bạn đang quay mặt: "hướng 4 giờ (phía sau bên phải)"
function guide(mp, myHead, p) {
  const b = bearing(mp, p);
  const g = { d: Math.round(dist(mp, p)), compass: dirName(b), b, radar: RADAR[Math.round(((b % 360) + 360) % 360 / 45) % 8] };
  if (myHead === null) return g;
  const rel = ((b - myHead) % 360 + 540) % 360 - 180; // -180..180, dương = bên phải
  g.rel = rel;
  const r = Math.abs(rel), side = rel > 0 ? "phải" : "trái";
  g.clock = ((Math.round(rel / 30) % 12) + 12) % 12 || 12;
  g.side = r <= 20 ? "thẳng phía trước" : r <= 70 ? "phía trước bên " + side : r <= 110 ? "bên " + side : r <= 160 ? "phía sau bên " + side : "sau lưng";
  g.turn = r <= 20 ? "cứ đi thẳng" : `xoay sang ${side} khoảng ${Math.round(r / 5) * 5}°`;

}

// Radar PVN trong game và bản đồ này đều để Bắc ở trên -> nói hướng theo vị trí trên radar
const RADAR = ["phía trên", "trên-phải", "bên phải", "dưới-phải", "phía dưới", "dưới-trái", "bên trái", "trên-trái"];

// Mũi tên lớn (SVG) xoay theo góc deg (0 = chỉ lên)
function arrowSvg(deg, color, label) {
  return `<div class="arrow-box"><svg viewBox="-34 -34 68 68" width="76" height="76">`
    + `<circle r="31" fill="#14170f" stroke="#3a4030" stroke-width="2"/>`
    + `<text y="-21" text-anchor="middle" font-size="9" fill="#ff5a4f" font-weight="700">${label === "radar" ? "N" : "▲"}</text>`
    + `<g transform="rotate(${deg.toFixed(0)})"><path d="M0,-27 L12,-7 L4.5,-7 L4.5,22 L-4.5,22 L-4.5,-7 L-12,-7 Z" fill="${color}" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></g>`
    + `</svg><div class="arrow-cap">${label === "radar" ? "Theo radar (Bắc ở trên)" : "Theo hướng bạn nhìn"}</div></div>`;
}

// Địa danh gần mục tiêu nhất (tên này cũng hiện trên radar PVN)

// Tên tiếng Việt cho thú AI (tên class BP_<Loài>); loài khác giữ nguyên
const VI_ANIMAL = { Deer: "Hươu", Boar: "Lợn rừng", Goat: "Dê", Rabbit: "Thỏ", Chicken: "Gà", Crab: "Cua", Turtle: "Rùa", Seaturtle: "Rùa biển", Frog: "Ếch" };

// Vị trí cuối cùng của khủng long đã ra khỏi tầm server gửi (kênh đóng) trong GHOST_S giây gần đây.
// Bỏ qua nếu cùng người chơi đó đang hiện lại ở một kênh khác, hoặc kênh đóng vì chết (đã thành xác).

// Chỗ sỏi (tự ghi) gần vị trí p nhất (khoảng cách ngang, m)
function nearestGastro(p) {

  for (const g of learnedGastro()) { const d = Math.hypot(g[0] - p[1], g[1] - p[2]); if (d < bd) { bd = d; best = g; } }

// Mục tiêu đang ghim (bấm vào chấm) và đối tượng đang rê chuột

// ---------- biến đổi toạ độ ----------
function resize() { cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; draw(); }

function fitAll() {

  else for (const a of actors) for (const s of a.t) { x0 = Math.min(x0, s[1]); x1 = Math.max(x1, s[1]); y0 = Math.min(y0, s[2]); y1 = Math.max(y1, s[2]); }

// ---------- bản đồ Gateway có sẵn ----------
// gastroOn = sỏi tự ghi (chỗ khủng long đã nhặt sỏi, DATA.gastro); pvnGastroOn = điểm sỏi của PVN (không khớp game, mặc định tắt)

// Địa hình quanh vị trí (bán kính ~10 m), ƯỚC LƯỢNG từ màu ảnh nền (ảnh chụp từ trên xuống):

// Bản đồ nhiệt PVN: lưới 72×72 trên ảnh (u,v = góc ô) -> đốm đỏ mờ ở tâm ô, đậm theo intensity

  for (const L of labels) {
    const { sx, sy, w, h, gap } = L, d = 2 * dpr;
    // chỗ thử, gần chấm trước: phải, trái, trên, dưới, 4 góc; sau đó dịch dần lên/xuống ở bên phải rồi bên trái (tối đa ~3 dòng)
    const cand = [[sx + gap, sy - h / 2], [sx - gap - w, sy - h / 2], [sx - w / 2, sy - gap - h], [sx - w / 2, sy + gap],
      [sx + gap - d, sy - h - d], [sx + gap - d, sy + d], [sx - gap - w + d, sy - h - d], [sx - gap - w + d, sy + d]];
    for (let k = 1; k <= 6; k++) for (const s of [1, -1]) { cand.push([sx + gap, sy - h / 2 + s * k * LH / 2]); cand.push([sx - gap - w, sy - h / 2 + s * k * LH / 2]); }
    // giữ chỗ của khung trước nếu vẫn trống -> nhãn không nhảy qua lại khi chấm di chuyển liên tục
    const prev = labelSlot.get(L.a.i);
    let pi = prev !== undefined && inView(cand[prev][0], cand[prev][1], w, h) && !hits(cand[prev][0], cand[prev][1], w, h) ? prev : -1;
    if (pi < 0) pi = cand.findIndex(([x, y]) => inView(x, y, w, h) && !hits(x, y, w, h));
    if (pi < 0) pi = cand.findIndex(([x, y]) => !hits(x, y, w, h));
    if (pi < 0) pi = inView(cand[0][0], cand[0][1], w, h) ? 0 : 1;
    labelSlot.set(L.a.i, pi);
    const [x, y] = cand[pi];
    placed.push({ x, y, w, h });
    ctx.globalAlpha = L.ghost ? 0.7 : 1;
    // đường nối cùng màu chấm: từ mép chấm tới điểm gần nhất của nhãn (chỉ khi nhãn không nằm sát chấm)
    const nx = Math.max(x, Math.min(sx, x + w)), ny = Math.max(y, Math.min(sy, y + h));
    const dd = Math.hypot(nx - sx, ny - sy);
    if (dd > gap + 3 * dpr) {
      const ux = (nx - sx) / dd, uy = (ny - sy) / dd;
      ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 3.5 * dpr;
      ctx.beginPath(); ctx.moveTo(sx + ux * L.rr, sy + uy * L.rr); ctx.lineTo(nx, ny); ctx.stroke();
      ctx.strokeStyle = L.col; ctx.lineWidth = 1.5 * dpr; ctx.stroke();
    }
    // vạch màu luôn ở phía GẦN chấm: nhãn nằm bên trái chấm -> vạch ở mép phải, chữ căn phải
    const onLeft = x + w <= sx + 1;
    const bx = onLeft ? x + w - 5 * dpr : x;
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(bx, y + 1 * dpr, 5 * dpr, h - 2 * dpr);
    ctx.fillStyle = L.col; ctx.fillRect(bx + 1 * dpr, y + 2 * dpr, 3 * dpr, h - 4 * dpr);
    const tx = onLeft ? x + w - 7 * dpr : x + 7 * dpr;
    ctx.textAlign = onLeft ? "right" : "left";
    ctx.strokeStyle = "rgba(0,0,0,0.85)"; ctx.lineWidth = 3 * dpr;
    ctx.font = F1; ctx.fillStyle = L.c === "me" ? "#ffd34d" : "#fff";
    ctx.strokeText(L.l1, tx, y + 11 * dpr); ctx.fillText(L.l1, tx, y + 11 * dpr);
    if (L.l2) {
      ctx.font = F2; ctx.fillStyle = "#d8dccb";
      ctx.strokeText(L.l2, tx, y + LH + 10 * dpr); ctx.fillText(L.l2, tx, y + LH + 10 * dpr);
    }
  }
  ctx.restore();
}

function updateSide() {
  document.getElementById("time").textContent = fmt(t) + " / " + fmt(DATA ? DATA.length : 0);
  const el = document.getElementById("near"), tgEl = document.getElementById("target");
  const mp = me ? posAt(me, t) : null;
  if (!mp) {
    el.innerHTML = '<span class="info">Không thấy khủng long của bạn ở thời điểm này.</span>';
    tgEl.innerHTML = ""; return;
  }
  const myHead = headingAt(me, t);
  const name = a => esc(a.p || viName(a.n)) + (a.c === "corpse" ? " (xác)" : "");

  // mục tiêu đang ghim
  const pin = pinnedActor(), pp = pin ? posAt(pin, t) : null;
  if (pp) {
    const g = guide(mp, myHead, pp), poi = nearestPoi(pp);
    tgEl.innerHTML = `<div class="tg-name">${name(pin)}</div>`
      + `<div class="tg-big">${g.d} m · ${g.radar}</div>`
      + `<div class="arrows">${arrowSvg(g.b, "#ffd34d", "radar")}${g.rel !== undefined ? arrowSvg(g.rel, "#7ee081", "view") : ""}</div>`
      + (g.rel !== undefined ? `<div>${g.side} → <b>${g.turn}</b></div>` : "")
      + (poi ? `<div>Gần địa danh <b>${esc(poi.name)}</b>${poi.d > 30 ? ` (cách ${poi.d} m)` : ""}</div>` : "")
      + `<div class="info">Trên radar PVN, mục tiêu nằm ở ${g.radar} so với mũi tên vàng của bạn (phía ${g.compass}).</div>`
      + `<div class="row"><button id="unpin">Bỏ ghim</button></div>`;
    document.getElementById("unpin").onclick = () => { pinnedId = null; draw(); };
  } else {
    tgEl.innerHTML = `<span class="info">Bấm vào một chấm trên bản đồ (hoặc tên bên dưới) để chỉ đường tới đó. Bản đồ này xoay giống radar PVN (Bắc ở trên).</span>`;
  }

  // danh sách gần nhất (bấm để ghim)
  const list = actors.filter(a => ["player", "dino", "corpse", "animal"].includes(a.c) && CATS[a.c].on).map(a => { const p = posAt(a, t); return p ? { a, g: guide(mp, myHead, p) } : null; })
    .filter(Boolean).sort((x, y) => x.g.d - y.g.d).slice(0, 8);
  const ng = gw.gastroOn ? nearestGastro(mp) : null;
  const gastroHtml = ng ? `<div><span class="sw" style="display:inline-block;background:#d9d4c3;border-radius:2px"></span> Sỏi gần nhất – <b>${guideShort(guide(mp, myHead, [0, ng.g[0], ng.g[1], mp[3]]))}</b></div>` : "";
  el.innerHTML = gastroHtml + (list.length ? list.map(o => `<div class="near-item" data-i="${o.a.i}"><span class="sw" style="display:inline-block;background:${CATS[o.a.c].hex}"></span> ${name(o.a)} – <b>${guideShort(o.g)}</b></div>`).join("")
    : '<span class="info">Không có khủng long nào khác.</span>');
  for (const d of el.querySelectorAll(".near-item")) d.onclick = () => { pinnedId = +d.dataset.i; draw(); };
}
const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- tương tác ----------
let drag = null;
let downAt = null;
cv.addEventListener("mousedown", e => { downAt = { x: e.clientX, y: e.clientY }; if (pickMode || OVERLAY) return; drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy }; cv.classList.add("drag"); });
addEventListener("mouseup", () => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("click", e => {
  if (pickMode) { pickClick(e); return; }
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 4) return; // vừa kéo bản đồ, không phải bấm
  // bấm vào khủng long/xác/cá/thịt -> ghim làm mục tiêu chỉ đường; bấm lại lần nữa -> bỏ ghim
  const hit = nearestAt(e);
  if (hit && hit.a !== me) { pinnedId = pinnedId === hit.a.i ? null : hit.a.i; draw(); }
});
cv.addEventListener("mousemove", e => {
  if (drag) { view.cx = drag.cx - (e.clientX - drag.x) / view.s; view.cy = drag.cy - (e.clientY - drag.y) / view.s; draw(); return; }
  hover(e);
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (OVERLAY) { zoomStep(e.deltaY < 0); return; }
  const [wx, wy] = toWorld(e.offsetX, e.offsetY);
  view.s *= e.deltaY < 0 ? 1.25 : 0.8;
  const [nx, ny] = toWorld(e.offsetX, e.offsetY);
  view.cx += wx - nx; view.cy += wy - ny; draw();
}, { passive: false });

// Phóng to (zin = true) / thu nhỏ 1 nấc. Overlay: đổi bán kính radar (nhớ lại); bản đồ: zoom quanh tâm màn hình.
function zoomStep(zin) {
  if (OVERLAY) {
    ovR = Math.min(3000, Math.max(50, Math.round(ovR * (zin ? 0.8 : 1.25))));
    try { localStorage.setItem("isleOverlayR", ovR); } catch (err) {}
  } else view.s *= zin ? 1.25 : 0.8;
  draw();
}

function nearestAt(e) {
  let best = null, bd = 12;
  for (const a of actors) {
    if (!CATS[a.c].on) continue;
    const p = posAt(a, t); if (!p) continue;
    const [sx, sy] = toScreen(p[1], p[2]);
    const d = Math.hypot(sx / devicePixelRatio - e.offsetX, sy / devicePixelRatio - e.offsetY);
    if (d < bd) { bd = d; best = { a, p }; }
  }
  return best;
}
function hover(e) {
  const best = nearestAt(e);
  const newHover = best && best.a !== me ? best.a : null;
  if (newHover !== hoverActor) { hoverActor = newHover; draw(); }
  if (!best) { tip.style.display = "none"; return; }
  const { a, p } = best, mp = me ? posAt(me, t) : null;
  // dòng 1: tên · loài; dòng 2: loại, giới tính, % trưởng thành; rồi bảng nhãn | giá trị
  const kind = a === me ? "khủng long của bạn" : ({ player: "người chơi", corpse: "xác", animal: "thú AI", fish: "cá", meat: "thịt / nội tạng", dino: "khủng long AI" })[a.c] || a.c;
  const dinoLike = a === me || a.c === "player" || (a.c === "corpse" && !!a.p);
  let html = `<b>${esc(a === me ? "Bạn" : a.p || viName(a.n))}</b>${a.p || a === me ? " · " + esc(a.n) : ""}`;
  html += `<div style="color:var(--muted)">${[kind, dinoLike && a.g !== undefined ? (a.f ? "cái" : "đực") : "", a.g !== undefined ? "trưởng thành " + (a.g * 100).toFixed(0) + "%" : ""].filter(Boolean).join(" · ")}</div>`;
  const rows = [];
  if (mp && a !== me) {
    rows.push(["Cách bạn", `<b>${Math.round(dist(mp, p))} m</b>`]);
  } else if (a === me) {
    const h = headingAt(me, t);
    if (h !== null) rows.push(["Đang nhìn về", `<b>${dirName(h)}</b>`]);
  }
  let note = "";
  if (["me", "player", "dino", "animal"].includes(a.c)) { const pi = placeInfo(a, p); rows.push(...pi.rows); note = pi.note; }
  html += `<div class="tt">${rows.map(r => `<span class="tl">${r[0]}</span><span>${r[1]}</span>`).join("")}</div>`;
  if (note) html += `<div class="tn">${note}</div>`;
  html += `<div class="tn">${a !== me ? (a.i === pinnedId ? "Bấm để bỏ ghim" : "Bấm để ghim chỉ đường") + " · " : ""}X ${p[1]} · Y ${p[2]} · Z ${p[3]}</div>`;
  tip.innerHTML = html; tip.style.display = "block";
  tip.style.left = Math.min(e.offsetX + 14, cv.clientWidth - tip.offsetWidth - 6) + "px"; tip.style.top = (e.offsetY + 14) + "px";
}

// kéo về cuối thanh thời gian -> bám theo thời điểm mới nhất (đang quay: chạy mượt), kéo lùi -> đứng yên ở đó
slider.oninput = () => { t = +slider.value; follow = !!DATA && t >= DATA.length - 1; if (follow && DATA.live) { live.tv = null; t = liveTime(performance.now()); } draw(); };
document.getElementById("play").onclick = () => { playing = !playing; follow = false; document.getElementById("play").textContent = playing ? "❚❚ Dừng" : "▶ Phát"; if (playing && t >= DATA.length) t = 0; last = performance.now(); requestAnimationFrame(tick); };
document.getElementById("speed").onclick = e => { speed = speed === 1 ? 5 : speed === 5 ? 20 : 1; e.target.textContent = "x" + speed; };
document.getElementById("findMe").onclick = findMe;
document.getElementById("fitAll").onclick = fitAll;
let last = 0;
function tick(now) {
  if (!playing) return;
  t = Math.min(DATA.length, t + (now - last) / 1000 * speed); last = now; slider.value = t; draw();
  if (t >= DATA.length) { playing = false; follow = true; live.tv = null; document.getElementById("play").textContent = "▶ Phát"; draw(); return; }
  requestAnimationFrame(tick);
}

addEventListener("resize", resize);
updateMeta(); slider.value = t;
resize(); fitAll(); if (me && location.hash !== "#all") findMe();

// Đo tốc độ vẽ (mở trang với #bench): thời gian trung bình mỗi khung hình ở từng mức zoom
if (location.hash === "#bench") {
  const t0 = performance.now();
  const wait = setInterval(() => {
    if (!gw.ready) return;
    clearInterval(wait);
    const out = ["load " + Math.round(performance.now() - t0) + "ms"];
    fitAll();
    const base = view.s;
    for (const z of [1, 2, 4, 8, 16, 32]) {
      view.s = base * z; render();
      const a = performance.now();
      for (let i = 0; i < 30; i++) { view.cx += 50 / view.s; render(); }
      out.push("zoom x" + z + ": " + ((performance.now() - a) / 30).toFixed(1) + "ms");
    }
    document.title = "BENCH " + out.join(" | ");
    document.body.setAttribute("data-bench", out.join(" | "));
  }, 50);
}
</script>
</body>
</html>
